<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Inventario de despensa y lista de mercado compartida.">
  <title>Mercado Casa</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🛒</span>
      <h1>Mercado Casa</h1>
    </div>
    <button id="btnSync" class="icon-btn" title="Sincronizar" aria-label="Sincronizar">⟳</button>
  </header>

  <main id="vista" class="vista"></main>

  <nav class="tabbar">
    <button class="tab" data-vista="lista">📝<span>Lista</span></button>
    <button class="tab" data-vista="despensa">📦<span>Despensa</span></button>
    <button class="tab" data-vista="ajustes">⚙️<span>Ajustes</span></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
